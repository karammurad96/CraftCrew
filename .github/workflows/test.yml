name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # T270: the Stripe SDK is a dependency the payment tests load
      - run: npm ci
      - run: npm test
      # Google's Docker Hub mirror serves the same official base without shared-runner Hub rate limits.
      - name: Prefetch the official Node base through the Docker Hub mirror
        if: matrix.node == 20
        run: |
          docker pull mirror.gcr.io/library/node:20-alpine
          docker tag mirror.gcr.io/library/node:20-alpine node:20-alpine
      - name: Docker image builds
        if: matrix.node == 20
        run: docker build -t craftcrew-test .
      - name: Docker image starts without a database (STORE=json)
        if: matrix.node == 20
        run: |
          docker run -d --name craftcrew-test -p 3999:3000 -e BOOTSTRAP_ADMIN_EMAIL=admin@test.local \
            -e BOOTSTRAP_ADMIN_PASSWORD=Admin-Password-2026! craftcrew-test
          for i in $(seq 1 30); do curl -fs http://localhost:3999/api/health && exit 0; sleep 1; done
          docker logs craftcrew-test; exit 1

  # PostgreSQL (Wave 9): the whole suite with STORE=postgres (T162), each test data folder in its own schema.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_DB: craftcrew_test
          POSTGRES_USER: craftcrew
          POSTGRES_PASSWORD: craftcrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U craftcrew -d craftcrew_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://craftcrew:craftcrew@localhost:5432/craftcrew_test
      STORE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The restore drill (test/restore-drill.test.js, T167) needs the client tools of the server's version
      - name: PostgreSQL 16 client tools
        run: |
          v=$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1)
          [ "${v:-0}" -ge 16 ] || (sudo apt-get update && sudo apt-get install -y postgresql-client-16)
          pg_dump --version
      - run: npm test
      - run: node tools/db/migrate.js && node tools/db/migrate.js --status

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright axe-core && npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # XRechnung samples and a route-generated invoice must pass the official KoSIT validator (XRechnung 3.0.2).
  xrechnung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Samples are up to date
        run: node test/fixtures/xrechnung/samples.js --write && git diff --exit-code test/fixtures/xrechnung
      - name: Export an invoice through the API
        run: XRECHNUNG_OUT=xrechnung-out node --test test/xrechnung.test.js
      - name: Download the KoSIT validator and the XRechnung configuration
        run: |
          curl -fsSL -o validator.zip https://github.com/itplr-kosit/validator/releases/download/v1.5.0/validator-1.5.0-distribution.zip
          curl -fsSL -o config.zip https://github.com/itplr-kosit/validator-configuration-xrechnung/releases/download/release-2025-07-10/validator-configuration-xrechnung_3.0.2_2025-07-10.zip
          unzip -q validator.zip -d kosit
          unzip -q config.zip -d kosit/config
      - name: Validate
        run: java -jar kosit/validationtool-1.5.0-standalone.jar -s kosit/config/scenarios.xml -r kosit/config test/fixtures/xrechnung/*.xml xrechnung-out/*.xml
